<!doctype html>
<!-- biome-ignore lint/a11y/useValidLang: the lang and dir values below are
     placeholders, substituted with the resolved locale by transformPageChunk in
     hooks.server.ts before the document ever reaches a browser. Do not write
     either placeholder token literally in this file — the substitution is a
     single-occurrence String.replace, so an earlier mention consumes it. -->
<html lang="%lh.lang%" dir="%lh.dir%" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Theme before first paint. External, not inline: CSP is on and
		     SvelteKit nonces only its own scripts, so an inline one here is
		     blocked. Render-blocking on purpose — see static/theme.js. -->
		<script src="%sveltekit.assets%/theme.js"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
