<!doctype html>
<!-- biome-ignore lint/a11y/useValidLang: the lang and dir values below are
     placeholders, substituted with the resolved locale by transformPageChunk in
     hooks.server.ts before the document ever reaches a browser. Do not write
     either placeholder token literally in this file — the substitution is a
     single-occurrence String.replace, so an earlier mention consumes it. -->
<html lang="%lh.lang%" dir="%lh.dir%" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Theme before first paint: stored choice wins, then system.
			try {
				let theme = localStorage.getItem("lh-theme");
				if (!theme) {
					theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
				}
				document.documentElement.dataset.theme = theme;
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
