name: Distribution maintainer request
description: You maintain a distro or mirror we catalog and want something changed or removed.
labels: [maintainer-request]
body:
  - type: markdown
    attributes:
      value: |
        These are honoured without argument and without asking you to justify
        them. You do not need to prove you speak for the project — if the
        request is to *stop* doing something, we stop first and sort out the
        details afterwards.

  - type: dropdown
    id: kind
    attributes:
      label: What would you like changed?
      options:
        - Remove our use of your logo
        - Our crawler is causing you problems
        - Stop using a particular source of ours
        - Correct how the project is described
        - Something else
    validations:
      required: true

  - type: input
    id: distro
    attributes:
      label: Distribution or mirror
    validations:
      required: true

  - type: textarea
    id: detail
    attributes:
      label: Details
      description: |
        For crawler problems, the User-Agent and rough timing help — our
        ingestion identifies as `linuxhub-ingest/<version>` and should be
        making at most one request per second per host. If you are seeing more
        than that, it is a bug and we want to know.
    validations:
      required: true
