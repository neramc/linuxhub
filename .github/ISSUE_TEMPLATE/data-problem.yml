name: Wrong or stale data
description: A version, date, mirror or other fact on the site is incorrect.
labels: [data]
body:
  - type: markdown
    attributes:
      value: |
        Every factual value on the site is fetched from an official source and
        stored with the URL it came from and when. So the useful report is not
        just "this is wrong" but **which value, and what the source says** —
        that tells us whether the fetcher is broken, the source moved, or the
        source itself is wrong.

        Some fields are blank on purpose because no permitted source exists for
        them yet — rankings and download counts especially. Those are not bugs;
        see the "empty on purpose" table in `.ai/handoff.md`.

  - type: input
    id: where
    attributes:
      label: Where
      description: The page, and the field on it.
      placeholder: /distro/fedora — the version table says 43, latest is 44
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What it should say, and how you know
      description: An official URL carries far more weight than a correction on its own.
      placeholder: |
        Fedora 44 released 2026-04-28 — https://fedoraproject.org/…
    validations:
      required: true

  - type: input
    id: provenance
    attributes:
      label: Provenance line on the page, if shown
      description: The distro page prints where its data came from and when. Pasting it tells us if ingestion is simply stale.
      placeholder: endoflife.date — fetched 2026-08-04T03:44Z
