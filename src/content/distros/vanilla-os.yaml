name: Vanilla OS
order: 36
family: debian
basedOn: debian
status: active
releaseModel: fixed
desktops: [gnome]
packageManagers: [flatpak, apx, vso, abroot]
initSystem: systemd
installer: vanilla-installer
useCases: [desktop, developer, beginner]
difficulty: beginner
architectures: [x86_64, aarch64]
secureBoot: partial
immutable: true
origin:
  country: INT
  firstRelease: 2022-12-29
requirements:
  ramGB: 8
  diskGB: 50
  note:
    ko: 공식 설치 문서의 기준입니다(RAM 최소 4GB·권장 8GB). ABRoot의 A/B 시스템 파티션 때문에 디스크는 50GB 이상이 필요합니다. NVIDIA 드라이버나 커널 모듈을 쓰려면 Secure Boot를 꺼야 합니다.
    en: From the official installation guide (4 GB of RAM minimum, 8 GB recommended). The disk needs at least 50 GB because ABRoot keeps A/B system partitions. Secure Boot has to be turned off if you need NVIDIA drivers or other kernel modules.
