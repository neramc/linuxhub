name: Gentoo Linux
order: 31
family: gentoo
basedOn: null
status: active
releaseModel: rolling
desktops: [kde, gnome, none]
packageManagers: [portage]
initSystem: OpenRC / systemd
installer: gentoo-handbook
useCases: [tinkerer, developer, server]
difficulty: advanced
architectures: [x86_64, aarch64, i686, armhf, ppc64le, s390x, riscv64]
secureBoot: partial
immutable: false
origin:
  country: US
  firstRelease: 1999
requirements:
  ramGB: 2
  diskGB: 40
  note:
    ko: 공식 핸드북의 값입니다(루트 파티션 40GB 이상 권장, 최소 설치 CD는 RAM 140MB 이상, LiveGUI는 RAM 2GB 이상이어야 부팅). 소스에서 빌드하므로 사양이 낮으면 설치 시간이 길어집니다.
    en: Figures from the official Handbook (at least 40 GB recommended for the root partition; the minimal installation CD needs 140 MB of RAM and the LiveGUI 2 GB to boot). Gentoo builds from source, so lower-end hardware simply takes longer to install.
