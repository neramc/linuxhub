  license: GPLv3 / CC BY-SA 3.0
  alt:
    ko: Gentoo 라이브 GUI USB로 띄운 KDE Plasma 5.24 데스크톱. 시스템 설정의 이 시스템 정보 화면이 Gentoo 로고와 함께 소프트웨어 버전과 하드웨어 정보를 보여 주고, 화면 아래에 패널이 있습니다.
    en: "The KDE Plasma 5.24 desktop of the Gentoo live GUI USB: System Settings shows About this System with the Gentoo logo, the software versions and the hardware, above the bottom panel."
