  ko: Portage로 소스에서 직접 빌드해 시스템을 맞춰 쓰는 롤링 배포판
  en: A rolling distro where Portage builds software from source to fit your system
aliases: [젠투, 젠투 리눅스, 겐투, gentoo, portage]
