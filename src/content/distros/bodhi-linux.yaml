  note:
    ko: 공식 위키의 권장 사양은 64비트 1GHz CPU, 768MB RAM, 10GB 디스크이고 최소 사양은 512MB RAM, 5GB입니다. 설치 프로그램은 RAM 1GB 이상에서 가장 원활하다고 안내해 RAM은 1GB로 적었습니다.
    en: The official wiki recommends a 64-bit 1 GHz CPU, 768 MB of RAM and 10 GB of disk, with a minimum of 512 MB and 5 GB. The installer is said to run best with 1 GB or more, so RAM is listed as 1 GB.
