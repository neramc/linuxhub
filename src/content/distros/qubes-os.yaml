requirements:
  ramGB: 6
  diskGB: 32
  note:
    ko: 공식 최소 사양입니다(RAM 6GB, 여유 공간 32GB, VT-x/EPT와 VT-d 또는 AMD-V/RVI와 AMD-Vi가 있는 64비트 CPU). 권장 사양은 RAM 16GB, 여유 공간 128GB이고 SSD를 강력히 권장합니다.
    en: Official minimum (6 GB of RAM, 32 GB free space, a 64-bit CPU with Intel VT-x/EPT and VT-d, or AMD-V/RVI and AMD-Vi). Recommended is 16 GB of RAM and 128 GB of free space, with a fast SSD strongly advised.
