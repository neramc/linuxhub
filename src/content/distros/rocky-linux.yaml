requirements:
  ramGB: 4
  diskGB: 20
  note:
    ko: "Rocky Linux 10 공식 문서 기준입니다(권장: GUI 설치 시 RAM 4GB 이상, 디스크 20GB 이상이며 GUI 사용 시 40GB 이상. 최소: 텍스트 모드 설치 RAM 2GB, 디스크 10GB). x86_64는 x86-64-v3(Haswell급) 이상 CPU가 필요합니다."
    en: "From the Rocky Linux 10 documentation (recommended: 4 GB+ RAM for GUI installs and 20 GB+ disk, 40 GB+ with a GUI; minimum: 2 GB RAM for a text-mode install and 10 GB disk). On x86_64 the CPU must support x86-64-v3 (Haswell class or newer)."
