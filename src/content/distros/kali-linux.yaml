    ko: Kali Linux의 Xfce 데스크톱. 파란 바탕에 검은 용 모양 Kali 로고가 있고, 오른쪽에 홈 폴더를 연 파일 관리자 창이, 화면 위에 앱 아이콘과 작업 공간 번호가 있는 패널이 있습니다.
