requirements:
  ramGB: 2
  diskGB: 20
  note:
    ko: 기본 Xfce 데스크톱과 기본 도구 묶음(kali-linux-default) 기준 공식 권장치입니다. Burp Suite 같은 무거운 도구는 8GB RAM 이상을 권장합니다.
    en: Official guidance for the default Xfce desktop with the kali-linux-default tool set; heavy tools such as Burp Suite call for 8 GB of RAM or more.
