name: Tails
order: 39
family: debian
basedOn: debian
status: active
releaseModel: fixed
desktops: [gnome]
packageManagers: [apt, dpkg]
initSystem: systemd
installer: tails-usb
useCases: [privacy]
difficulty: intermediate
architectures: [x86_64]
secureBoot: "yes"
immutable: false
origin:
  country: INT
  firstRelease: 2009-06
requirements:
  ramGB: 3
  diskGB: 8
  note:
    ko: 공식 요구 사양입니다(RAM 3GB 이상, 8GB 이상 USB 메모리, 64비트 x86 PC). 디스크에 설치하지 않고 USB로 부팅합니다.
    en: Official requirements (3 GB of RAM, a USB stick of 8 GB or more, a 64-bit x86 PC). It boots from the USB stick and is not installed to the disk.
links:
  home: https://tails.net/
  download: https://tails.net/install/download/
  docs: https://tails.net/doc/
  installGuide: https://tails.net/install/
  forum: https://forum.torproject.org/c/support/tails/33
  releaseNotes: https://tails.net/news/
  source: https://gitlab.tails.net/tails/tails
tagline:
  ko: 모든 인터넷 연결을 Tor로 보내고 컴퓨터에 흔적을 남기지 않는 USB 부팅 배포판
  en: A USB-boot system that sends every connection through Tor and leaves no trace on the computer
aliases: [테일즈, 테일스, tails os]
logo:
  file: tails.svg
  source: https://tails.net/contribute/how/promote/logo/tails-logo-drawing.svg
  license: GPL-3.0+ (official Tails logo page); the Tails word and logo marks are Tor Marks under The Tor Project's trademark policy
  trademark: https://www.torproject.org/about/trademark/
screenshot:
  file: tails.webp
  source: https://commons.wikimedia.org/wiki/File:Tails_7.1_Screenshot_2025-10.png
  author: "Sora Célestinia (OS: The Tails Project; Tor Browser: Tor Project)"
  license: GPL
  licenseUrl: https://www.gnu.org/licenses/gpl.html
  alt:
    ko: Tails 7.1에서 Tor Browser를 연 화면. 새 탭에 Tor 프로젝트의 안내 상자와 DuckDuckGo 검색 창, 그리고 지금 Tails 7.1을 쓰고 있다는 문구가 보입니다. 화면 위에는 GNOME 상단 표시줄이, 아래에는 창 목록이 있습니다.
    en: "Tor Browser open in Tails 7.1: the new tab shows a Tor Project notice, a DuckDuckGo search field and a line saying you are running Tails 7.1, with the GNOME top bar above and the window list below."
  caption:
    ko: Tails 7.1에서 실행한 Tor Browser
    en: Tor Browser running on Tails 7.1
