    ko: Oracle Linux 10 설치 가이드 기준입니다(논리 CPU 1개당 RAM 1.5GB이고 CPU는 최소 2개이므로 3GB, 디스크 최소 10GB·권장 20GB). x86_64는 x86-64-v3 CPU가 필요합니다.
    en: From the Oracle Linux 10 installation guide (1.5 GB RAM per logical CPU with at least 2 CPUs, so 3 GB; disk 10 GB minimum, 20 GB recommended). On x86_64 the CPU must support x86-64-v3.
