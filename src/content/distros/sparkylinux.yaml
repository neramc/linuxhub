  ko: 안정판과 세미 롤링판을 함께 내는 Debian 기반 경량 배포판
  en: A lightweight Debian-based distro with both stable and semi-rolling lines
aliases: [스파키 리눅스, 스파키, 스파키리눅스, sparky, sparky linux]
