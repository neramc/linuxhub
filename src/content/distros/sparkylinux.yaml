name: SparkyLinux
order: 50
family: debian
basedOn: debian
status: active
releaseModel: fixed
desktops: [xfce, lxqt, mate, kde, openbox]
packageManagers: [apt, dpkg]
initSystem: systemd
installer: calamares
useCases: [lightweight, desktop, tinkerer]
difficulty: intermediate
architectures: [x86_64, i686, aarch64]
secureBoot: "yes"
immutable: false
origin:
  country: INT
  firstRelease: 2012
requirements:
  ramGB: 1
  diskGB: 10
  note:
    ko: 공식 위키의 최소 사양 기준입니다. 기본 설치 프로그램(Calamares)은 RAM 1GB가 필요하고, 그보다 적으면 Advanced Installer(텍스트 모드)를 쓰라고 안내합니다. 홈 에디션은 디스크 10GB, GameOver와 Multimedia는 20GB입니다.
    en: Based on the official wiki's minimums. The default Calamares installer needs 1 GB of RAM; below that the project points to its Advanced (text-mode) installer. The home editions want 10 GB of disk, GameOver and Multimedia 20 GB.
