name: antiX
order: 27
family: debian
basedOn: debian
status: active
releaseModel: fixed
desktops: [icewm, fluxbox, jwm]
packageManagers: [apt, dpkg]
initSystem: runit / sysVinit / dinit / s6
installer: antix-installer
useCases: [lightweight, tinkerer, desktop]
difficulty: intermediate
architectures: [x86_64, i686]
secureBoot: "no"
immutable: false
origin:
  country: INT
  firstRelease: 2007-07-09
requirements:
  ramGB: 0.5
  diskGB: 10
  note:
    ko: 공식 FAQ 기준입니다. RAM은 512MB가 권장 최소(antiX-full은 1GB 이상 권장, core는 스왑을 잡으면 256MB에서도 동작)이고, 디스크는 antiX-full이 10GB, core가 2GB입니다. About 페이지는 설치에 7GB를 안내하지만 최신 FAQ의 값을 따랐습니다.
    en: Based on the official FAQ. 512 MB of RAM is the recommended bare minimum (1 GB or more is preferred for antiX-full; core runs on 256 MB with swap), and disk needs are 10 GB for antiX-full and 2 GB for core. The About page still says 7 GB for an install; the newer FAQ figure is used here.
