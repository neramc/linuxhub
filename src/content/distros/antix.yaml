  author: AntiX Devs
  license: GPL
  licenseUrl: https://www.gnu.org/licenses/gpl.html
  alt:
    ko: antiX 23.1의 IceWM 데스크톱. 화면 가운데 금빛 antiX 글자가 들어간 바탕에, 왼쪽 위로 파일 관리자·FAQ·설치 프로그램 아이콘이 있고, 오른쪽 위의 Conky 위젯이 시각과 CPU·메모리·디스크 사용량을 보여 줍니다. 화면 아래에 작업 표시줄이 있습니다.
    en: "The IceWM desktop of antiX 23.1: a wallpaper with gold antiX lettering, File Manager, FAQ and Installer icons at the top left, a Conky widget with the time and CPU, memory and disk use at the top right, and the task bar along the bottom."
