  note:
    ko: Slackware 15.0 설치 안내(Slackware-HOWTO)의 요구 사양입니다(RAM 1GB 이상, 20GB 이상의 파티션). 전체 설치에는 16GB 가까이 들어갑니다. 64비트판은 x86_64 CPU가, 32비트판은 i586 이상의 CPU가 필요합니다.
    en: Official requirements from the Slackware 15.0 install guide (Slackware-HOWTO), which asks for 1 GB of RAM or more and a partition of at least 20 GB, since a full install takes almost 16 GB. The 64-bit edition needs an x86_64 CPU and the 32-bit edition runs on i586 or better.
