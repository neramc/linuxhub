name: NixOS
order: 21
family: independent
basedOn: null
status: active
releaseModel: fixed
desktops: [gnome, kde, xfce, mate, pantheon, i3, none]
packageManagers: [nix]
initSystem: systemd
installer: nixos-installer
useCases: [developer, tinkerer, server]
difficulty: advanced
architectures: [x86_64, aarch64]
secureBoot: partial
immutable: false
origin:
  country: NL
  firstRelease: 2013
requirements:
  ramGB: 0.75
  diskGB: 10
  note:
    ko: 공식 설명서가 VirtualBox 가상 머신 예시에서 안내하는 값입니다(메모리 768MB 이상, 디스크 10GB 이상). 실제 PC에 그래픽 설치 이미지와 데스크톱 환경을 쓰려면 이보다 여유가 필요할 수 있습니다.
    en: Figures from the official manual's VirtualBox guest example (768 MB of memory or more, 10 GB of disk or more). A graphical installer and a desktop on real hardware may need more headroom.
