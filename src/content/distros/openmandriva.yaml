  note:
    ko: ROME과 Rock 6.0 릴리스 노트의 요구 사양입니다(RAM 2GB 이상, 디스크 최소 10GB이며 Plasma 전체 설치에는 20GB 권장, OpenGL 2.0 이상을 지원하는 3D 그래픽). 위키의 요구 사양 문서는 64비트 CPU가 필요하고 RAM 8GB 정도면 쾌적하다고 안내합니다.
    en: From the ROME and Rock 6.0 release notes (at least 2 GB of RAM and 10 GB of disk, with 20 GB recommended for a full Plasma install, and a 3D card with OpenGL 2.0 or newer). The wiki requirements page asks for a 64-bit CPU and calls about 8 GB of RAM comfortable.
