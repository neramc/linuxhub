name: CentOS Stream
order: 41
family: rhel
basedOn: fedora
status: active
releaseModel: semi-rolling
desktops: [gnome]
packageManagers: [dnf, rpm, flatpak]
initSystem: systemd
installer: anaconda
useCases: [server, enterprise, developer]
difficulty: intermediate
architectures: [x86_64, aarch64, ppc64le, s390x]
secureBoot: "yes"
immutable: false
origin:
  country: US
  firstRelease: 2019-09-24
requirements:
  ramGB: 1.5
  diskGB: 10
  note:
    ko: RHEL 10 설치 문서의 최소 사양입니다. CentOS 사이트가 이 문서를 CentOS Stream에도 대부분 적용된다고 안내합니다(로컬 미디어 설치 RAM 1.5GiB, 디스크 10GiB). 권장 사양은 공개되어 있지 않습니다. CentOS Stream 10의 x86_64는 x86-64-v3 CPU가 필요합니다.
    en: Minimum from the RHEL 10 installation guide, which the CentOS site says mostly applies to CentOS Stream too (local media install, 1.5 GiB RAM, 10 GiB disk). No recommended figures are published. On x86_64, CentOS Stream 10 needs an x86-64-v3 CPU.
