requirements:
  ramGB: 4
  diskGB: 40
  note:
    ko: 공식 Leap 16.0 다운로드 페이지는 2GHz 듀얼코어 CPU, RAM 2GB(작업량만큼 추가), 여유 디스크 40GB 이상을 안내합니다. 공식 Start-Up 안내(Leap 15.6)는 RAM 4GB 이상을 강하게 권하고, Btrfs 스냅숏을 쓰면 루트 40GB를 권합니다. Leap 16은 x86-64-v2 이상 CPU가 필요합니다.
    en: The Leap 16.0 download page lists a 2 GHz dual-core CPU, 2 GB RAM (plus memory for your workload) and over 40 GB of free disk. The Leap 15.6 Start-Up guide strongly recommends 4 GB or more RAM, and 40 GB for the root partition with Btrfs snapshots. Leap 16 needs an x86-64-v2 or newer CPU.
