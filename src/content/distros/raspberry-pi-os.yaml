name: Raspberry Pi OS
order: 38
family: debian
basedOn: debian
status: active
releaseModel: fixed
desktops: [lxde]
packageManagers: [apt, dpkg]
initSystem: systemd
installer: raspberry-pi-imager
useCases: [education, tinkerer, lightweight]
difficulty: beginner
architectures: [aarch64, armhf]
secureBoot: "no"
immutable: false
origin:
  country: GB
  firstRelease: 2012-07
requirements:
  ramGB: 1
  diskGB: 32
  note:
    ko: Raspberry Pi 보드 전용입니다. 데스크톱 판은 32GB 이상 SD 카드를 권장하며, 공식 RAM 권장치는 없지만 Pi 3(1GB) 이상에서 쓸 만하다고 안내합니다. PC용 UEFI Secure Boot는 해당되지 않습니다.
    en: Runs on Raspberry Pi boards only. A 32 GB or larger SD card is recommended for the desktop image; there is no official RAM figure, but Pi 3 (1 GB) and newer are described as practical. PC-style UEFI Secure Boot does not apply.
