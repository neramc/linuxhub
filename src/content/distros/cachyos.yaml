    ko: 보라색 하늘과 구름, 하늘을 가르는 청록색 혜성을 그린 만화풍 배경 화면 위에 CachyOS Hello 창이 열려 있습니다. 창에는 'Welcome to CachyOS!' 제목 아래 문서, 지원, 프로젝트 링크 버튼과 'Launch installer' 버튼이 있고, 화면 아래에 KDE Plasma 작업 표시줄이 있습니다.
