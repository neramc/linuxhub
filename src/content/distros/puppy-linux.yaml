name: Puppy Linux
order: 51
family: independent
basedOn: null
upstream: Debian / Ubuntu / Slackware / Void Linux
status: active
releaseModel: fixed
desktops: [jwm]
packageManagers: [ppm, apt, xbps]
initSystem: Puppy rc.sysinit (BusyBox-style init)
installer: puppy-installer
useCases: [lightweight, desktop]
difficulty: intermediate
architectures: [x86_64, i686]
secureBoot: "no"
immutable: false
origin:
  country: INT
  firstRelease: 2003
requirements:
  ramGB: 2
  diskGB: 2
  note:
    ko: 공식 안내의 최소 사양입니다. 최신 Puppy는 64비트 CPU와 RAM 2GB가 필요합니다(요구 사양 안내에는 64비트판 RAM 1GB, 32비트판은 펜티엄 4급 CPU와 RAM 512MB로 적혀 있습니다). 저장 공간은 설치에 1GB, 프로그램을 더하면 2GB 이상입니다.
    en: Official minimums. Newer Puppy releases need a 64-bit CPU and 2 GB of RAM (the system-requirements guide lists 1 GB for 64-bit editions and a Pentium 4 with 512 MB for 32-bit ones). Storage is 1 GB for an install and 2 GB or more once you add software.
