requirements:
  ramGB: 4
  diskGB: 40
  note:
    ko: Nobara 사이트와 위키에 최소 사양이 없어 보수적으로 잡은 추정값입니다. RAM은 Fedora Workstation의 권장 사양(4GB)을 따랐고, 디스크는 ISO가 7~9GB로 크고 패키지가 많은 점을 고려해 Fedora 권장(20GB)의 두 배로 잡았습니다. 설치 USB는 8GB 이상이 필요합니다.
    en: Nobara's site and wiki list no minimum specs, so these are conservative estimates. RAM follows Fedora Workstation's recommendation (4 GB), and disk is twice Fedora's recommended 20 GB because the images are large (7 to 9 GB) and carry more packages. The install USB must be at least 8 GB.
